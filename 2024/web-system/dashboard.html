<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Metrics & Admin Dashboard 2024</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="components.css">
</head>
<body>
    <div class="container" style="padding-top: 2rem;">
        <h2>System Health & Metric Monitoring</h2>
        <div class="grid-cards" style="margin-top: 1.5rem;">
            <div class="card">
                <h4>Total Active Transactions</h4>
                <p style="font-size: 2rem; font-weight: bold; color: #10b981;">14,892</p>
                <small>+18.4% from last period</small>
            </div>
            <div class="card">
                <h4>API P99 Latency</h4>
                <p style="font-size: 2rem; font-weight: bold; color: #60a5fa;">42ms</p>
                <small>Target: &lt; 100ms</small>
            </div>
            <div class="card">
                <h4>Cluster CPU Utilization</h4>
                <p style="font-size: 2rem; font-weight: bold; color: #f59e0b;">38.6%</p>
                <small>6 Nodes Operational</small>
            </div>
        </div>
        <p><a href="index.html" class="btn btn-outline">&larr; Return to Main Portal</a></p>
    </div>
</body>
</html>
