version: '3.8'

services:
  api-service:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres-db
      - REDIS_HOST=redis-cache
    depends_on:
      - postgres-db
      - redis-cache
    restart: always

  postgres-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secureproductionpassword2026
      POSTGRES_DB: corestack_prod
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis-cache:
    image: redis:7-alpine
    restart: always

volumes:
  pgdata:
